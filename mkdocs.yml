site_name: syseng-toolkit
site_description: Free systems engineering templates for small hardware teams, in Google Sheets and Excel.
site_url: https://syseng-toolkit.github.io/
repo_url: https://github.com/syseng-toolkit/syseng-toolkit.github.io
repo_name: syseng-toolkit/syseng-toolkit.github.io
edit_uri: ""

# MkDocs skips a docs/templates/ folder by default (it's meant for theme overrides); this puts it back.
exclude_docs: |
  !/templates/
  # Not public yet. To publish one, delete its line here and add it back under Templates in nav.
  /templates/task-tracker.md
  /templates/bom.md

copyright: © 2026 Stephen Mock and Seena Vafaee · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>

theme:
  name: material
  icon:
    logo: material/toolbox
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

hooks:
  - hooks/vmodel.py
  - hooks/cache_bust.py

watch:
  - data
  - hooks

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sheet-preview.js

nav:
  - Home: index.md
  - Get started: get-started.md
  - Templates:
      - templates/index.md
      - Document List: templates/document-list.md
      - Requirements: templates/requirements.md
  - About:
      - Contributors: contributors.md
      - License: license.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
